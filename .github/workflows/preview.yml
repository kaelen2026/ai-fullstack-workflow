name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

# One in-flight deploy per PR.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  PR: ${{ github.event.number }}
  ROOT_DOMAIN: w3ctech.dev

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy API preview Worker
        run: |
          set -euo pipefail
          API_NAME="aifw-api-pr-${PR}"
          WEB_URL="https://preview-${PR}.${ROOT_DOMAIN}"
          # Previews share the dev DB (already migrated by the dev deploy).
          pnpm --filter @repo/api exec wrangler deploy \
            --name "$API_NAME" \
            --var "CORS_ORIGIN:${WEB_URL}"
          bash ./.github/scripts/cf-attach-domain.sh "$API_NAME" "preview-${PR}-api.${ROOT_DOMAIN}"

      - name: Build & deploy Web preview Worker
        env:
          # Baked into the client bundle at build time.
          NEXT_PUBLIC_API_URL: https://preview-${{ github.event.number }}-api.w3ctech.dev
        run: |
          set -euo pipefail
          WEB_NAME="aifw-web-pr-${PR}"
          pnpm --filter @repo/web exec opennextjs-cloudflare build
          pnpm --filter @repo/web exec wrangler deploy --name "$WEB_NAME"
          bash ./.github/scripts/cf-attach-domain.sh "$WEB_NAME" "preview-${PR}.${ROOT_DOMAIN}"

      - name: Comment preview URLs
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.issue.number;
            const marker = '<!-- preview-urls -->';
            const body = `${marker}\n### 🚀 Preview deployed\n\n| | URL |\n| --- | --- |\n| Web | https://preview-${pr}.w3ctech.dev |\n| API | https://preview-${pr}-api.w3ctech.dev/health |\n\n_Updated for ${context.sha.slice(0, 7)} — torn down automatically when this PR closes._`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
